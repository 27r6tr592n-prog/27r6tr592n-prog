name: Animações de contribuições

on:
  schedule:
    - cron: "0 3 * * *" # todo dia às 00:00 de Brasília
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Gerar o Galaga
        uses: abozanona/pacman-contribution-graph@v5.0.0
        with:
          github_user_name: ${{ github.repository_owner }}
          games: galaga

      - name: Fundo transparente no Galaga escuro
        run: |
          sed -i '0,/<rect width="100%" height="100%" fill="#000000"\/>/s///' dist/galaga-contribution-graph-dark.svg
          ! grep -q '<rect width="100%" height="100%" fill="#000000"/>' dist/galaga-contribution-graph-dark.svg

      - name: Publicar no branch output
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
